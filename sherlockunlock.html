<style>
:root {
  --bg:#07080f;--bg-elevated:#0d0f1a;--bg-card:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.06);--border-hover:rgba(255,255,255,0.12);
  --text:#f0f1f5;--text-dim:#8a8fa8;--text-muted:#5a5f78;
  --accent:#7c3aed;--accent-light:#a78bfa;--accent-glow:rgba(124,58,237,0.3);
  --success:#10b981;--success-glow:rgba(16,185,129,0.25);--secondary:#3b82f6;
  --hot:#f97316;--vip:#ec4899;--new:#06b6d4;
  --radius:20px;--radius-sm:12px;--radius-xs:8px;--shadow-lg:0 16px 48px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 800px 800px at 20% 30%,rgba(124,58,237,0.08) 0%,transparent 60%),radial-gradient(ellipse 600px 600px at 80% 70%,rgba(59,130,246,0.06) 0%,transparent 60%)}
.card{position:relative;z-index:1;background:var(--bg-card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:var(--radius);padding:36px 24px;max-width:460px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.app-icon{width:88px;height:88px;border-radius:20px;overflow:hidden;margin:0 auto 16px;box-shadow:0 8px 24px rgba(0,0,0,0.4);border:2px solid rgba(59,130,246,0.3);background:#0d0f1a}
.app-icon img{width:100%;height:100%;object-fit:contain}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.badge-ios{background:rgba(59,130,246,0.15);color:var(--secondary);border:1px solid rgba(59,130,246,0.25)}
h1{font-size:24px;font-weight:800;margin-bottom:4px}
.mod-text{font-size:13px;color:var(--text-dim);margin-bottom:6px}
.rating{color:#f59e0b;font-size:14px;margin-bottom:16px}
.screenshots-section{margin:20px 0}
.screenshots-section h3{font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:10px;text-align:left}
.screenshots-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.screenshot-placeholder{aspect-ratio:9/16;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:all .3s ease}
.screenshot-placeholder img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm)}
.screenshot-placeholder:hover{border-color:var(--secondary)}
.thank-you{color:var(--success);font-size:14px;font-weight:600;margin:16px 0 20px;line-height:1.5}
.btn-ios{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;font-weight:700;font-size:15px;cursor:pointer;transition:all .25s ease;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:linear-gradient(135deg,var(--secondary),#2563eb);color:white;box-shadow:0 4px 14px rgba(59,130,246,0.25)}
.btn-ios:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(59,130,246,0.3)}
.btn-ios svg{width:20px;height:20px;fill:currentColor}
.note{font-size:11px;color:var(--text-dim);margin-top:12px;line-height:1.5}
.footer-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.footer-links a{color:var(--text-dim);text-decoration:none;font-size:10px;font-weight:500;transition:color .2s}
.footer-links a:hover{color:var(--accent)}
@media(max-width:400px){.card{padding:24px 14px}.app-icon{width:70px;height:70px}h1{font-size:20px}}
</style>
</head>
