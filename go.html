<style>
:root {
  --bg:#07080f;--bg-elevated:#0d0f1a;--bg-card:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.06);--border-hover:rgba(255,255,255,0.12);
  --text:#f0f1f5;--text-dim:#8a8fa8;--text-muted:#5a5f78;
  --accent:#7c3aed;--accent-light:#a78bfa;--accent-glow:rgba(124,58,237,0.3);
  --success:#10b981;--success-glow:rgba(16,185,129,0.25);--warning:#f59e0b;
  --hot:#f97316;--vip:#ec4899;--new:#06b6d4;
  --radius:20px;--radius-sm:12px;--radius-xs:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 800px 800px at 20% 30%,rgba(124,58,237,0.08) 0%,transparent 60%),radial-gradient(ellipse 600px 600px at 80% 70%,rgba(16,185,129,0.06) 0%,transparent 60%)}
.card{position:relative;z-index:1;background:var(--bg-card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:var(--radius);padding:40px 28px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.5)}
.success-icon{width:70px;height:70px;border-radius:50%;background:rgba(16,185,129,0.1);border:2px solid rgba(16,185,129,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.success-icon svg{width:34px;height:34px;stroke:var(--success);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:24px;font-weight:800;margin-bottom:6px}
.thank{color:var(--success);font-size:14px;font-weight:600;margin-bottom:18px;line-height:1.5}
.app-info{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:20px;text-align:left}
.app-icon{width:52px;height:52px;border-radius:12px;overflow:hidden;background:#0d0f1a;flex-shrink:0}
.app-icon img{width:100%;height:100%;object-fit:contain}
.app-details h3{font-size:15px;font-weight:700;margin-bottom:2px}
.app-details p{font-size:11px;color:var(--text-dim)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;margin-bottom:8px;transition:all .3s ease}
.btn:hover{transform:translateY(-2px)}
.btn-android{background:linear-gradient(135deg,var(--success),#059669);color:white;box-shadow:0 4px 14px var(--success-glow)}
.btn-ios{background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;box-shadow:0 4px 14px rgba(59,130,246,0.25)}
.btn svg{width:18px;height:18px;fill:currentColor}
.note{font-size:11px;color:var(--text-dim);margin-top:10px;line-height:1.5}
.note a{color:var(--accent-light);text-decoration:none}
.footer-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.footer-links a{color:var(--text-dim);text-decoration:none;font-size:10px;font-weight:500;transition:color .2s}
.footer-links a:hover{color:var(--accent)}
@media(max-width:400px){.card{padding:24px 16px}h1{font-size:20px}}
</style>
</head>
<body>
<div class="bg-mesh"></div>

<script>
var app = JSON.parse(localStorage.getItem('pendingApp') || '{}');
if(app.name){
  document.getElementById('appName').textContent = app.name;
  document.getElementById('appMod').textContent = app.mod || '';
  document.getElementById('appIcon').src = app.icon || '';
  if(app.dl) document.getElementById('btnAndroid').href = app.dl;
  if(app.dlIos) document.getElementById('btnIos').href = app.dlIos;
  if(app.iosOnly){ document.getElementById('btnAndroid').style.display = 'none'; document.getElementById('btnIos').style.width = '100%'; }
}
</script>
